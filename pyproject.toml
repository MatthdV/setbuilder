[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setbuilder"
version = "0.1.0"
description = "Outil perso de préparation de sets DJ sur la librairie Rekordbox"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
rekordbox = ["pyrekordbox==0.4.4"]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "umap-learn>=0.5.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
