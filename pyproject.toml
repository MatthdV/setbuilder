[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setbuilder"
version = "0.1.0"
description = "Outil perso de préparation de sets DJ sur la librairie Rekordbox"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
rekordbox = ["pyrekordbox==0.4.4"]
# Modèles ML. Pins transformers/tokenizers OBLIGATOIRES : MuQ casse avec transformers 5.x.
analysis = [
    "essentia-tensorflow==2.1b6.dev1389",
    "torch",
    "muq==0.1.0",
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "umap-learn",
    "soundfile",
    "numpy",
]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "umap-learn>=0.5.12",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
